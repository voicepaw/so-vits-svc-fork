[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "so-vits-svc-fork"
version = "4.3.0"
description = "A fork of so-vits-svc."
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "click>=8.1.8",
  "cm-time>=0.1.2",
  "fastapi>=0.116.1",
  "librosa>=0.11",
  "lightning>=2.5.5",
  "matplotlib>=3.9.4",
  "numpy>=2.0.2",
  "pebble>=5.1.3",
  "praat-parselmouth>=0.4.6",
  "psutil>=7.1.2",
  "pysimplegui-4-foss>=4.60.4.1",
  "pyworld>=0.3.5",
  "requests>=2.32.5",
  "rich>=14.1",
  "scipy>=1.13.1",
  "sounddevice>=0.5.2",
  "soundfile>=0.13.1",
  "tensorboard>=2.20",
  "tensorboardx>=2.6.5",
  "torch>=2.8",
  "torchaudio>=2.8",
  "torchcrepe>=0.0.24",
  "tqdm>=4.67.1",
  "tqdm-joblib>=0.0.4",
  "transformers>=4.56.1",
]
urls."Bug Tracker" = "https://github.com/voicepaw/so-vits-svc-fork/issues"
urls.Changelog = "https://github.com/voicepaw/so-vits-svc-fork/blob/main/CHANGELOG.md"
urls.documentation = "https://so-vits-svc-fork.readthedocs.io"
urls.repository = "https://github.com/voicepaw/so-vits-svc-fork"
scripts.svc = "so_vits_svc_fork.__main__:cli"
scripts.svcg = "so_vits_svc_fork.gui:main"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.setuptools]
package-data.so_vits_svc_fork = [ "**/*.json" ]

[tool.ruff]
extend = ".venv/ruff.toml"
line-length = 150
lint.select = [ "F", "I", "W" ]
lint.per-file-ignores."tests/**/*" = [ "F401" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
