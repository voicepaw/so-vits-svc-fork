name: Hacktoberfest

on:
  schedule:
    # Run every day in October
    - cron: "0 0 * 10 *"
    # Run on the 1st of November to revert
    - cron: "0 13 1 11 *"

jobs:
  hacktoberfest:
    runs-on: ubuntu-latest

    steps:
      - uses: browniebroke/hacktoberfest-labeler-action@2f6920da8cd6b34672115c707ae90f441bf1592a # v2.7.0
        with:
          github_token: ${{ secrets.GH_PAT }}
