name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: 34j/.github/.github/workflows/python-package-ci.yml@4b672e6833ffe6204b173099bee0a7fdbfaa34c9 # main
    permissions:
      attestations: write
      contents: write
      id-token: write
  publish:
    if: needs.ci.outputs.released == 'true'
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
